components:
  schemas:
    Transporte:
      type: object
      properties:
        id:
          type: integer
        codigo:
          type: string
        descripcion:
          type: string
        fechaCreacion:
          type: string
          format: date-time
        estado:
          type: boolean
        cliente:
          $ref: '#/components/schemas/Cliente'
        ruta:
          $ref: '#/components/schemas/Ruta'
    Vehiculo:
      type: object
      properties:
        id:
          type: integer
        matricula:
          type: string
        marca:
          type: string
        modelo:
          type: string
        disponible:
          type: boolean
        capacidadCarga:
          type: number
          format: float
        fechaFabricacion:
          type: string
          format: date
    Ruta:
      type: object
      properties:
        id:
          type: integer
        origen:
          type: string
        destino:
          type: string
        fechaSalida:
          type: string
          format: date-time
        distancia:
          type: number
          format: float
    Cliente:
      type: object
      properties:
        id:
          type: integer
        nombre:
          type: string
        direccion:
          type: string
        telefono:
          type: string
        fechaRegistro:
          type: string
          format: date
        vip:
          type: boolean
    Empleado:
      type: object
      properties:
        id:
          type: integer
        nombre:
          type: string
        puesto:
          type: string
        salario:
          type: number
          format: float
        fechaContratacion:
          type: string
          format: date