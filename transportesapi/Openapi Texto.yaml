        '500':
          description: Error del servidor
    post:
      tags:
        - empleados
      summary: Crear un nuevo empleado
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Empleado'
      responses:
        '201':
          description: Empleado creado correctamente
        '400':
          description: Error en los datos proporcionados

  /empleados/{id}:
    get:
      tags:
        - empleados
      summary: Obtener empleado por ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Empleado encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Empleado'
        '404':
          description: Empleado no encontrado
    put:
      tags:
        - empleados
      summary: Actualizar un empleado existente
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Empleado'
